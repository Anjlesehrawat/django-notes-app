apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: 3

  selector:
    matchLabels:
      app: django

  template:
    metadata:
      labels:
        app: django

    spec:

      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql-service 3306; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is available"

      containers:
        - name: django
          image: anjlesehrawat/notes-app:latest

          ports:
            - containerPort: 8000

          env:
            - name: DB_HOST
              value: mysql-service

            - name: DB_PORT
              value: "3306"
