apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: django
spec:
  replicas: 3
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
   volumeMounts:
     - name: nginx-config
       mountPath: /etc/nginx/conf.d/default.conf 
       subPath: default.conf
   
volumes:
  - name: nginx-config 
    configMap:
      name: nginx-config
